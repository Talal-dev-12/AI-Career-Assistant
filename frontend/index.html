<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Assistant - Job Scraper</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="icon">🤖</span>
                <h1>AI Career Assistant</h1>
            </div>
            <p>Job Scraping & Verification System</p>
        </header>

        <main>
            <!-- Control Panel -->
            <section class="panel control-panel">
                <h2>New Scrape</h2>
                <form id="scrape-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="keyword">Keyword</label>
                            <input type="text" id="keyword" required placeholder="e.g. Python Developer">
                        </div>
                        <div class="form-group">
                            <label for="location">Location</label>
                            <input type="text" id="location" placeholder="e.g. Lahore">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="job-type">Job Type</label>
                            <select id="job-type">
                                <option value="">Any</option>
                                <option value="full-time">Full-time</option>
                                <option value="part-time">Part-time</option>
                                <option value="contract">Contract</option>
                                <option value="internship">Internship</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Platforms</label>
                            <div class="checkbox-group">
                                <label><input type="checkbox" id="plat-indeed" checked> Indeed</label>
                                <label><input type="checkbox" id="plat-linkedin" checked> LinkedIn</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="max-pages">Max Pages/Platform</label>
                            <input type="number" id="max-pages" value="1" min="1" max="10">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="btn-scrape" class="btn btn-primary">Start Scrape</button>
                        <button type="button" id="btn-cancel-scrape" class="btn btn-secondary" style="display:none; background-color: #f85149; border-color: #f85149; color: white;">Stop Scrape</button>
                    </div>
                </form>
            </section>

            <!-- Results Section -->
            <section class="panel results-panel">
                <div class="results-header">
                    <h2>Scraped Jobs (<span id="job-count">0</span>)</h2>
                    <button id="btn-verify" class="btn btn-secondary" disabled>Verify Jobs</button>
                </div>
                
                <div id="loading" class="hidden">
                    <div class="spinner"></div>
                    <p id="loading-text">Processing...</p>
                </div>

                <div class="jobs-grid" id="jobs-container">
                    <!-- Jobs will be rendered here -->
                    <div class="empty-state">No jobs scraped yet. Fill out the form above to start.</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Live Log Panel -->
    <section id="log-panel">
        <div class="log-header">
            <h3>Live Logs <span id="log-status" class="log-status" title="connecting…">●</span></h3>
            <div class="log-controls">
                <select id="log-level-filter">
                    <option value="ALL">All</option>
                    <option value="INFO">Info+</option>
                    <option value="WARNING">Warnings+</option>
                    <option value="ERROR">Errors only</option>
                </select>
                <label><input type="checkbox" id="log-autoscroll" checked> Auto-scroll</label>
                <button id="log-clear" type="button">Clear</button>
            </div>
        </div>
        <pre id="log-output" class="log-output"></pre>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
