# Combined docker-compose.yml for Core Pipeline and Application Automation Backend

services:

  # ── Core Pipeline Services (from Talal-2) ───────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://career:career@db:5432/career
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/srv/uploads

  worker-verify:
    build: .
    command: python -m app.pipeline.workers verify
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://career:career@db:5432/career
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/srv/uploads

  worker-docgen:
    build: .
    command: python -m app.pipeline.workers docgen
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://career:career@db:5432/career
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/srv/uploads

  worker-submit:
    build: .
    command: python -m app.pipeline.workers submit
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://career:career@db:5432/career
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/srv/uploads

  tracker:
    build: .
    command: python -m app.pipeline.tracking
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://career:career@db:5432/career
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/srv/uploads

  scheduler:
    build: .
    command: python -m app.pipeline.scheduler
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career
      POSTGRES_DB: career
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career"]
      interval: 5s
      retries: 10


  # ── Application Automation Services (from hammad) ───────────────────────────
  postgres:
    image: postgres:16.3-alpine
    container_name: automation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-automation_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-automation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.2-alpine
    container_name: automation_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  automation-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: automation-api:latest
    container_name: automation_migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-automation_db}
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo '==> Running Alembic migrations...' &&
        alembic upgrade head &&
        echo '==> Seeding RBAC roles and permissions...' &&
        python scripts/seed_rbac.py &&
        echo '==> Verifying RBAC seed...' &&
        python scripts/verify_rbac.py &&
        echo '==> Migration and seed complete.'
      "

  automation-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: automation-api:latest
    container_name: automation_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-automation_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "${API_PORT:-8004}:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      automation-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  automation-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: automation-worker:latest
    container_name: automation_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-automation_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CHROME_NO_SANDBOX: "1"
      CHROME_HEADLESS: "1"
      WDM_LOG_LEVEL: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      automation-migrate:
        condition: service_completed_successfully
    command: >
      celery -A app.tasks.celery_app.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-4}
      --queues=high,normal,low
      --hostname=worker@%h
      --max-tasks-per-child=100
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app.celery_app", "inspect", "ping", "--timeout=5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  automation-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: automation-worker:latest
    container_name: automation_beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-automation_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      automation-migrate:
        condition: service_completed_successfully
    command: >
      celery -A app.tasks.celery_app.celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
      --pidfile=/tmp/celerybeat.pid

  automation-flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: automation-worker:latest
    container_name: automation_flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      PYTHONUNBUFFERED: "1"
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.celery_app.celery_app flower
      --port=5555
      --broker=redis://redis:6379/1
      --url-prefix=flower
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/flower/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  django-backend:
    build:
      context: .
      dockerfile: Dockerfile.django
    image: django-backend:latest
    container_name: django_backend
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./mabd:/srv/mabd

volumes:
  pgdata:
  postgres_data:
    driver: local
  redis_data:
    driver: local
